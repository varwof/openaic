name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'   # weekly full suite

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CONNECTION_PROXY: ""   # CI: direct download (config.mk default is Tor)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Checkout types (vector reference)
        uses: actions/checkout@v4
        with:
          repository: varwof/types
          path: types

      - name: Generate cross-consistency vectors (Go)
        run: |
          cd test/vectors
          go mod tidy
          go run . -out ../../test/vectors/out

      - name: Fetch OpenSSL 3.5.7
        run: make fetch

      - name: Apply patch and build
        run: make build

      - name: Run AIC extension tests
        run: |
          make test-helper
          cc -o build/aic_ext_test test/aic_ext_test.c \
            src/v3_aic.c src/aic_verify.c lib/openaic.c lib/cjson/cJSON.c \
            -Isrc -Ilib -Ilib/cjson \
            -Ipatch-dir/include -Lpatch-dir -lcrypto \
            -Wall -Wextra -O2
          LD_LIBRARY_PATH=patch-dir ./build/aic_ext_test test/vectors/out

      - name: Verify patch applies cleanly to pristine tree
        run: |
          cd openssl-src && git init -q && git add -A && \
            git -c user.email=ci@openaic -c user.name=ci commit -qm base
          cd .. && git apply --check patch/openssl-3.5.7-aic.patch --directory=openssl-src

  full-suite:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    env:
      CONNECTION_PROXY: ""
    steps:
      - uses: actions/checkout@v4
      - name: Fetch OpenSSL 3.5.7
        run: make fetch
      - name: Apply patch and build
        run: make build
      - name: Run full OpenSSL test suite
        run: make -C patch-dir test
